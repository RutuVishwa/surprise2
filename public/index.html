<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blink Detection Demo</title>
    
    <!-- MediaPipe FaceMesh CDN - Updated URLs -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1620248257/drawing_utils.js" crossorigin="anonymous"></script>
    
    <!-- React and ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: white;
            overflow-x: hidden;
        }
        
        #root {
            width: 100vw;
            height: 100vh;
        }
        
        /* Loading state */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Error fallback */
        .error-fallback {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 2rem;
            text-align: center;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        
        .error-fallback h1 {
            margin-bottom: 1rem;
            font-size: 2rem;
        }
        
        .error-fallback p {
            margin-bottom: 2rem;
            opacity: 0.9;
            max-width: 500px;
            line-height: 1.6;
        }
        
        .retry-button {
            padding: 0.75rem 1.5rem;
            background: white;
            color: #dc2626;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .retry-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div id="root">
        <!-- Loading state while React loads -->
        <div class="loading">
            <div class="loading-spinner"></div>
        </div>
    </div>

    <!-- BlinkDetector Component -->
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // MediaPipe FaceMesh configuration
        const FACE_MESH_CONFIG = {
          locateFile: (file) => {
            // Use the CDN path for MediaPipe assets
            return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/${file}`;
          },
        };

        // Eye landmark indices for MediaPipe FaceMesh
        const LEFT_EYE_LANDMARKS = {
          top: 159,    // Upper eyelid center
          bottom: 145, // Lower eyelid center
          left: 33,    // Left corner
          right: 133,  // Right corner
        };

        const RIGHT_EYE_LANDMARKS = {
          top: 386,    // Upper eyelid center
          bottom: 374, // Lower eyelid center
          left: 362,   // Left corner
          right: 263,  // Right corner
        };

        // Blink detection thresholds - made more sensitive for testing
        const BLINK_THRESHOLDS = {
          eyeAspectRatioThreshold: 0.3,   // Increased threshold (less sensitive) for testing
          minBlinkDuration: 50,           // Reduced duration for easier detection
          cooldownPeriod: 300,             // Reduced cooldown for testing
          consecutiveFrames: 1,            // Reduced frames needed
        };

        const BlinkDetector = () => {
          // Refs for DOM elements and MediaPipe
          const videoRef = useRef(null);
          const canvasRef = useRef(null);
          const streamRef = useRef(null);
          const faceMeshRef = useRef(null);
          const animationFrameRef = useRef(null);
          
          // State management
          const [isCameraActive, setIsCameraActive] = useState(false);
          const [isBlinkDetected, setIsBlinkDetected] = useState(false);
          const [currentContent, setCurrentContent] = useState('A');
          const [permissionStatus, setPermissionStatus] = useState('prompting');
          const [errorMessage, setErrorMessage] = useState('');
          const [showDebug, setShowDebug] = useState(true); // Enable debug by default for testing
          const [isLoading, setIsLoading] = useState(true);
          const [backgroundColor, setBackgroundColor] = useState('#667eea');
          
          // Blink detection state
          const blinkStateRef = useRef({
            isBlinking: false,
            blinkStartTime: 0,
            lastBlinkTime: 0,
            consecutiveBlinks: 0,
            leftEyeOpenness: 0,
            rightEyeOpenness: 0,
          });

          // Calculate Eye Aspect Ratio (EAR) for blink detection
          const calculateEyeAspectRatio = useCallback((landmarks, eyeLandmarks) => {
            const top = landmarks[eyeLandmarks.top];
            const bottom = landmarks[eyeLandmarks.bottom];
            const left = landmarks[eyeLandmarks.left];
            const right = landmarks[eyeLandmarks.right];
            
            // Vertical eye distance
            const verticalDistance = Math.sqrt(
              Math.pow(top.x - bottom.x, 2) + Math.pow(top.y - bottom.y, 2)
            );
            
            // Horizontal eye distance
            const horizontalDistance = Math.sqrt(
              Math.pow(left.x - right.x, 2) + Math.pow(left.y - right.y, 2)
            );
            
            // Eye Aspect Ratio
            return verticalDistance / horizontalDistance;
          }, []);

          // Initialize webcam
          const initializeWebcam = useCallback(async () => {
            try {
              console.log('Starting camera initialization...');
              setPermissionStatus('requesting');
              setErrorMessage('');
              
              // Request camera access with mobile-friendly constraints
              const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                  facingMode: 'user', // Front camera for mobile
                  width: { ideal: 640, max: 1280 },
                  height: { ideal: 480, max: 720 },
                },
                audio: false,
              });
              
              console.log('Camera stream obtained:', stream);
              streamRef.current = stream;
              
              // Set camera active immediately since we got the stream
              setIsCameraActive(true);
              setPermissionStatus('granted');
              
              // Set video source when video element is available
              if (videoRef.current) {
                videoRef.current.srcObject = stream;
                console.log('Video source set successfully');
              } else {
                console.log('Video ref not available yet, will set when component renders');
              }
            } catch (error) {
              console.error('Camera access error:', error);
              setPermissionStatus('denied');
              setErrorMessage(
                error.name === 'NotAllowedError' 
                  ? 'Camera access denied. Please allow camera access to use blink detection.'
                  : 'Camera not available. Please check your device settings.'
              );
            }
          }, []);

          // Initialize MediaPipe FaceMesh
          const initializeFaceMesh = useCallback(async () => {
            try {
              console.log('Initializing MediaPipe FaceMesh...');
              
              // Wait for MediaPipe to be available
              if (!window.FaceMesh) {
                console.error('MediaPipe FaceMesh not loaded');
                throw new Error('MediaPipe FaceMesh not loaded');
              }
              
              console.log('MediaPipe FaceMesh available, creating instance...');
              
              // Load MediaPipe FaceMesh
              const faceMesh = new window.FaceMesh(FACE_MESH_CONFIG);
              
              console.log('Setting FaceMesh options...');
              faceMesh.setOptions({
                maxNumFaces: 1, // Process only one face for performance
                refineLandmarks: false, // Disable for better performance on mobile
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5,
              });
              
              console.log('Setting up results callback...');
              faceMesh.onResults((results) => {
                console.log('FaceMesh results received:', results);
                onFaceMeshResults(results);
              });
              
              faceMeshRef.current = faceMesh;
              console.log('MediaPipe FaceMesh initialized successfully');
              setIsLoading(false);
            } catch (error) {
              console.error('FaceMesh initialization error:', error);
              console.error('Error details:', error.message, error.stack);
              setErrorMessage(`Failed to initialize face detection: ${error.message}. Please refresh the page.`);
              setIsLoading(false);
            }
          }, []);

          // Handle FaceMesh results and blink detection
          const onFaceMeshResults = useCallback((results) => {
            if (!canvasRef.current || !results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
              console.log('No face landmarks detected');
              return;
            }
            
            const landmarks = results.multiFaceLandmarks[0];
            const currentTime = Date.now();
            const blinkState = blinkStateRef.current;
            
            // Calculate eye aspect ratios for both eyes
            const leftEAR = calculateEyeAspectRatio(landmarks, LEFT_EYE_LANDMARKS);
            const rightEAR = calculateEyeAspectRatio(landmarks, RIGHT_EYE_LANDMARKS);
            
            // Average eye aspect ratio
            const averageEAR = (leftEAR + rightEAR) / 2;
            
            // Update blink state
            blinkState.leftEyeOpenness = leftEAR;
            blinkState.rightEyeOpenness = rightEAR;
            
            // Check if eyes are closed (blink detected)
            const eyesClosed = averageEAR < BLINK_THRESHOLDS.eyeAspectRatioThreshold;
            
            console.log(`EAR Values - Left: ${leftEAR.toFixed(3)}, Right: ${rightEAR.toFixed(3)}, Average: ${averageEAR.toFixed(3)}, Eyes Closed: ${eyesClosed}, Threshold: ${BLINK_THRESHOLDS.eyeAspectRatioThreshold}`);
            
            if (eyesClosed && !blinkState.isBlinking) {
              // Start of potential blink
              console.log('Blink started');
              blinkState.isBlinking = true;
              blinkState.blinkStartTime = currentTime;
              blinkState.consecutiveBlinks = 1;
            } else if (eyesClosed && blinkState.isBlinking) {
              // Continuing blink
              blinkState.consecutiveBlinks++;
              console.log(`Blink continuing, frame: ${blinkState.consecutiveBlinks}`);
            } else if (!eyesClosed && blinkState.isBlinking) {
              // End of blink - check if it was a valid blink
              const blinkDuration = currentTime - blinkState.blinkStartTime;
              const timeSinceLastBlink = currentTime - blinkState.lastBlinkTime;
              
              console.log(`Blink ended - Duration: ${blinkDuration}ms, Frames: ${blinkState.consecutiveBlinks}, Time since last: ${timeSinceLastBlink}ms`);
              
              const isValidBlink = 
                blinkDuration >= BLINK_THRESHOLDS.minBlinkDuration &&
                blinkState.consecutiveBlinks >= BLINK_THRESHOLDS.consecutiveFrames &&
                timeSinceLastBlink >= BLINK_THRESHOLDS.cooldownPeriod;
              
              console.log(`Valid blink: ${isValidBlink}`);
              
              if (isValidBlink) {
                // Trigger blink action
                console.log('TRIGGERING BLINK ACTION!');
                setIsBlinkDetected(true);
                setCurrentContent(prev => prev === 'A' ? 'B' : 'A');
                
                // Change background color on blink
                const colors = ['#667eea', '#764ba2', '#f59e0b', '#10b981', '#ef4444', '#8b5cf6', '#ec4899'];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                setBackgroundColor(randomColor);
                
                blinkState.lastBlinkTime = currentTime;
                
                // Reset blink indicator after short delay
                setTimeout(() => setIsBlinkDetected(false), 200);
              }
              
              // Reset blink state
              blinkState.isBlinking = false;
              blinkState.consecutiveBlinks = 0;
            }
            
            // Draw debug overlay if enabled
            if (showDebug) {
              drawDebugOverlay(results, landmarks);
            }
          }, [calculateEyeAspectRatio, showDebug]);

          // Draw debug overlay with eye landmarks
          const drawDebugOverlay = useCallback((results, landmarks) => {
            const canvas = canvasRef.current;
            const ctx = canvas.getContext('2d');
            
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw eye landmarks and borders
            const drawEyeWithBorder = (eyeLandmarks, color, eyeName) => {
              // Get the key points for this eye
              const top = landmarks[eyeLandmarks.top];
              const bottom = landmarks[eyeLandmarks.bottom];
              const left = landmarks[eyeLandmarks.left];
              const right = landmarks[eyeLandmarks.right];
              
              // Convert to canvas coordinates
              const canvasTop = { x: top.x * canvas.width, y: top.y * canvas.height };
              const canvasBottom = { x: bottom.x * canvas.width, y: bottom.y * canvas.height };
              const canvasLeft = { x: left.x * canvas.width, y: left.y * canvas.height };
              const canvasRight = { x: right.x * canvas.width, y: right.y * canvas.height };
              
              // Draw border around eye
              ctx.strokeStyle = color;
              ctx.lineWidth = 3;
              ctx.beginPath();
              
              // Create rounded rectangle around eye landmarks
              const width = Math.abs(canvasRight.x - canvasLeft.x);
              const height = Math.abs(canvasBottom.y - canvasTop.y);
              const centerX = (canvasLeft.x + canvasRight.x) / 2;
              const centerY = (canvasTop.y + canvasBottom.y) / 2;
              
              // Draw rounded rectangle
              ctx.roundRect(centerX - width/2, centerY - height/2, width, height, 10);
              ctx.stroke();
              
              // Draw landmark points
              ctx.fillStyle = color;
              Object.values(eyeLandmarks).forEach(index => {
                const landmark = landmarks[index];
                ctx.beginPath();
                ctx.arc(
                  landmark.x * canvas.width,
                  landmark.y * canvas.height,
                  4, // Point size
                  0,
                  2 * Math.PI
                );
                ctx.fill();
              });
              
              // Draw eye label
              ctx.fillStyle = '#FFFFFF';
              ctx.font = 'bold 12px Arial';
              ctx.fillText(eyeName, canvasLeft.x - 30, canvasTop.y - 10);
            };
            
            // Draw both eyes with borders
            drawEyeWithBorder(LEFT_EYE_LANDMARKS, '#FF6B6B', 'LEFT EYE');
            drawEyeWithBorder(RIGHT_EYE_LANDMARKS, '#4ECDC4', 'RIGHT EYE');
            
            // Draw eye openness values
            ctx.fillStyle = '#FFFFFF';
            ctx.font = '14px monospace';
            ctx.fillText(`L: ${blinkStateRef.current.leftEyeOpenness.toFixed(3)}`, 10, 20);
            ctx.fillText(`R: ${blinkStateRef.current.rightEyeOpenness.toFixed(3)}`, 10, 40);
            ctx.fillText(`Threshold: ${BLINK_THRESHOLDS.eyeAspectRatioThreshold}`, 10, 60);
          }, []);

          // Main processing loop
          const processVideo = useCallback(() => {
            if (videoRef.current && faceMeshRef.current && isCameraActive) {
              faceMeshRef.current.send({ image: videoRef.current });
            }
            animationFrameRef.current = requestAnimationFrame(processVideo);
          }, [isCameraActive]);

          // Cleanup function
          const cleanup = useCallback(() => {
            // Stop video stream
            if (streamRef.current) {
              streamRef.current.getTracks().forEach(track => track.stop());
              streamRef.current = null;
            }
            
            // Cancel animation frame
            if (animationFrameRef.current) {
              cancelAnimationFrame(animationFrameRef.current);
              animationFrameRef.current = null;
            }
            
            // Close FaceMesh
            if (faceMeshRef.current) {
              faceMeshRef.current.close();
              faceMeshRef.current = null;
            }
            
            setIsCameraActive(false);
          }, []);

          // Initialize on component mount
          useEffect(() => {
            const initialize = async () => {
              // Wait a bit for scripts to load
              await new Promise(resolve => setTimeout(resolve, 1000));
              
              // Try initializing with retry logic
              let retries = 3;
              while (retries > 0) {
                try {
                  await initializeFaceMesh();
                  break; // Success, exit retry loop
                } catch (error) {
                  console.error(`Initialization attempt ${4 - retries} failed:`, error);
                  retries--;
                  if (retries > 0) {
                    console.log(`Retrying in 2 seconds... (${retries} attempts left)`);
                    await new Promise(resolve => setTimeout(resolve, 2000));
                  } else {
                    console.error('All initialization attempts failed');
                    setErrorMessage('Failed to initialize MediaPipe after multiple attempts. Please refresh the page or try a different browser.');
                  }
                }
              }
            };
            
            initialize();
            
            return cleanup;
          }, [initializeFaceMesh, cleanup]);

          // Update CSS variable when background color changes
          useEffect(() => {
            document.documentElement.style.setProperty('--bg-color', backgroundColor);
          }, [backgroundColor]);

          // Set video source when camera becomes active
          useEffect(() => {
            if (isCameraActive && streamRef.current && videoRef.current) {
              videoRef.current.srcObject = streamRef.current;
              console.log('Video source set in useEffect');
            }
          }, [isCameraActive]);

          // Start video processing when camera is active
          useEffect(() => {
            if (isCameraActive) {
              processVideo();
            }
            
            return () => {
              if (animationFrameRef.current) {
                cancelAnimationFrame(animationFrameRef.current);
              }
            };
          }, [isCameraActive]);

          // Handle video metadata loaded
          const handleVideoLoadedMetadata = () => {
            if (canvasRef.current && videoRef.current) {
              // Set canvas dimensions to match video
              canvasRef.current.width = videoRef.current.videoWidth;
              canvasRef.current.height = videoRef.current.videoHeight;
            }
          };

          // Show loading state while MediaPipe loads
          if (isLoading) {
            return (
              <div className="loading">
                <div className="loading-spinner"></div>
              </div>
            );
          }

          // Always show enable camera button if camera is not active
          if (!isCameraActive) {
            return (
              <div className="blink-detector">
                <header className="header">
                  <h1>Blink Detection Demo</h1>
                  <div className="status-indicators">
                    <div className="status inactive">
                      📹 Camera Inactive
                    </div>
                  </div>
                </header>
                <main className="main-content">
                  <div className="permission-prompt">
                    <h2>Enable Camera for Blink Detection</h2>
                    <p>
                      This demo uses your webcam to detect eye blinks and change background colors.
                      Your camera feed is processed locally and never leaves your device.
                    </p>
                    <button 
                      onClick={initializeWebcam}
                      className="primary-button"
                    >
                      Enable Camera
                    </button>
                  </div>
                </main>
                <footer className="controls">
                  <button
                    onClick={() => setShowDebug(!showDebug)}
                    className="control-button"
                    disabled={true}
                  >
                    {showDebug ? 'Hide' : 'Show'} Debug
                  </button>
                  <button
                    onClick={cleanup}
                    className="control-button danger"
                    disabled={true}
                  >
                    Stop Camera
                  </button>
                </footer>
              </div>
            );
          }

          return (
            <div className="blink-detector">
              {/* Header with status */}
              <header className="header">
                <h1>Blink Detection Demo</h1>
                <div className="status-indicators">
                  <div className={`status ${isCameraActive ? 'active' : 'inactive'}`}>
                    📹 Camera {isCameraActive ? 'Active' : 'Inactive'}
                  </div>
                  {isBlinkDetected && (
                    <div className="status blink-detected">
                      👁️ Blink Detected!
                    </div>
                  )}
                </div>
              </header>

              {/* Main content area */}
              <main className="main-content">
                {/* Error message */}
                {errorMessage && (
                  <div className="error-message">
                    <p>{errorMessage}</p>
                    <button onClick={initializeWebcam} className="secondary-button">
                      Try Again
                    </button>
                  </div>
                )}

                {/* Camera and content display */}
                {isCameraActive && !errorMessage && (
                  <div className="camera-container">
                    <div className="video-wrapper">
                      <video
                        ref={videoRef}
                        autoPlay
                        playsInline
                        muted
                        onLoadedMetadata={handleVideoLoadedMetadata}
                        className="video-feed"
                      />
                      <canvas
                        ref={canvasRef}
                        className={`debug-overlay ${showDebug ? 'visible' : 'hidden'}`}
                      />
                    </div>
                    
                    {/* Content that changes on blink */}
                    <div className="content-display">
                      {currentContent === 'A' ? (
                        <div className="content-a">
                          <h2>Content A</h2>
                          <p>Blink to switch to Content B</p>
                        </div>
                      ) : (
                        <div className="content-b">
                          <h2>Content B</h2>
                          <p>Blink to switch back to Content A</p>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </main>

              {/* Controls */}
              <footer className="controls">
                <button
                  onClick={() => setShowDebug(!showDebug)}
                  className="control-button"
                  disabled={!isCameraActive}
                >
                  {showDebug ? 'Hide' : 'Show'} Debug
                </button>
                <button
                  onClick={cleanup}
                  className="control-button danger"
                  disabled={!isCameraActive}
                >
                  Stop Camera
                </button>
              </footer>
            </div>
          );
        };

        // Render the app
        try {
          ReactDOM.render(<BlinkDetector />, document.getElementById('root'));
        } catch (error) {
          console.error('React rendering error:', error);
          // Fallback error display
          document.getElementById('root').innerHTML = `
            <div class="error-fallback">
              <h1>Application Error</h1>
              <p>Failed to load the blink detection application. Please check your internet connection and refresh the page.</p>
              <button class="retry-button" onclick="location.reload()">Refresh Page</button>
            </div>
          `;
        }
    </script>

    <style>
        .blink-detector {
          min-height: 100vh;
          background: linear-gradient(135deg, var(--bg-color, #667eea) 0%, #764ba2 100%);
          color: white;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          display: flex;
          flex-direction: column;
          transition: background 0.5s ease;
        }

        .header {
          padding: 1rem;
          text-align: center;
          background: rgba(0, 0, 0, 0.2);
          backdrop-filter: blur(10px);
        }

        .header h1 {
          margin: 0 0 1rem 0;
          font-size: clamp(1.5rem, 4vw, 2.5rem);
        }

        .status-indicators {
          display: flex;
          justify-content: center;
          gap: 1rem;
          flex-wrap: wrap;
        }

        .status {
          padding: 0.5rem 1rem;
          border-radius: 2rem;
          font-size: 0.875rem;
          font-weight: 600;
          transition: all 0.3s ease;
        }

        .status.active {
          background: #10b981;
          box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
        }

        .status.inactive {
          background: #6b7280;
        }

        .status.blink-detected {
          background: #f59e0b;
          animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
          0%, 100% { transform: scale(1); }
          50% { transform: scale(1.05); }
        }

        .main-content {
          flex: 1;
          padding: 2rem 1rem;
          display: flex;
          justify-content: center;
          align-items: center;
        }

        .permission-prompt {
          text-align: center;
          max-width: 400px;
          background: rgba(255, 255, 255, 0.1);
          padding: 2rem;
          border-radius: 1rem;
          backdrop-filter: blur(10px);
        }

        .permission-prompt h2 {
          margin: 0 0 1rem 0;
          font-size: 1.5rem;
        }

        .permission-prompt p {
          margin: 0 0 2rem 0;
          line-height: 1.6;
          opacity: 0.9;
        }

        .error-message {
          text-align: center;
          max-width: 400px;
          background: rgba(239, 68, 68, 0.2);
          padding: 2rem;
          border-radius: 1rem;
          border: 1px solid rgba(239, 68, 68, 0.5);
        }

        .camera-container {
          width: 100%;
          max-width: 1200px;
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 2rem;
          align-items: start;
        }

        .video-wrapper {
          position: relative;
          background: #000;
          border-radius: 1rem;
          overflow: hidden;
          aspect-ratio: 4/3;
        }

        .video-feed {
          width: 100%;
          height: 100%;
          object-fit: cover;
          transform: scaleX(-1); /* Mirror video for natural interaction */
        }

        .debug-overlay {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          pointer-events: none;
          transform: scaleX(-1);
        }

        .debug-overlay.visible {
          opacity: 1;
        }

        .debug-overlay.hidden {
          opacity: 0;
        }
