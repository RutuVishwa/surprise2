<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Blink Detection</title>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: white;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .status {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            backdrop-filter: blur(10px);
            text-align: center;
        }
        
        .success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.5);
        }
        
        .blink-detected {
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid rgba(245, 158, 11, 0.5);
            animation: pulse 0.5s ease-in-out;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }
        
        .video-container {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        
        .video-feed {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .photo-display {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            text-align: center;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .photo-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
        
        .photo-image {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: opacity 0.3s ease;
        }
        
        .photo-info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
        }
        
        .photo-counter {
            font-size: 1.2rem;
            font-weight: 600;
            color: #f59e0b;
            margin-bottom: 10px;
        }
        
        .photo-name {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        
        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 44px;
        }
        
        button:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }
        
        button:disabled {
            background: #6b7280;
            cursor: not-allowed;
            transform: none;
        }
        
        .info-panel {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
        }
        
        .info-panel h3 {
            margin-bottom: 10px;
        }
        
        .info-panel ul {
            list-style: none;
            padding: 0;
        }
        
        .info-panel li {
            margin: 5px 0;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 Photo Blink Detection</h1>
            <p>Blink to cycle through photos</p>
        </div>
        
        <div id="status" class="status">
            <p>📹 Initializing camera...</p>
        </div>
        
        <div class="main-content">
            <div class="video-container">
                <img id="videoFeed" class="video-feed" src="/video_feed" alt="Video feed">
            </div>
            
            <div class="photo-display">
                <div class="photo-container">
                    <img id="photoImage" class="photo-image" src="/photos/1.jpeg" alt="Current photo">
                    <div class="photo-info">
                        <div class="photo-counter" id="photoCounter">Photo 1 / ?</div>
                        <div class="photo-name" id="photoName">Loading...</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button onclick="manualBlink()">👁️ Manual Blink Test</button>
            <button onclick="toggleDebug()">🔍 Toggle Debug Info</button>
            <button onclick="resetPhotos()">🔄 Reset Photos</button>
        </div>
        
        <div id="debugInfo" class="info-panel" style="display: none;">
            <h3>🔍 Debug Information</h3>
            <ul>
                <li>Current Photo: <span id="debugCurrentPhoto">1</span> / <span id="debugTotalPhotos">?</span></li>
                <li>Blink Detection: <strong>OpenCV Haar Cascades</strong></li>
                <li>Backend: <strong>Python Flask</strong></li>
                <li>Last Blink: <span id="debugLastBlink">Never</span></li>
                <li>Detection Method: <strong>Eyes Closed Detection</strong></li>
            </ul>
        </div>
    </div>

    <script>
        let currentPhotoIndex = 0;
        let totalPhotos = 0;
        let debugVisible = false;
        
        // Update status message
        function updateStatus(message, isBlink = false) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `<p>${message}</p>`;
            statusDiv.className = isBlink ? 'status blink-detected' : 'status success';
            console.log('STATUS:', message);
        }
        
        // Update photo display with smooth transition
        function updatePhoto(photoIndex, totalPhotos) {
            currentPhotoIndex = photoIndex;
            totalPhotos = totalPhotos;
            
            const photoImage = document.getElementById('photoImage');
            const photoCounter = document.getElementById('photoCounter');
            const photoName = document.getElementById('photoName');
            
            // Fade out current photo
            photoImage.style.opacity = '0.5';
            
            setTimeout(() => {
                // Update photo image
                photoImage.src = `/photos/${photoIndex + 1}.jpeg`;
                
                // Update photo info
                photoCounter.textContent = `Photo ${photoIndex + 1} / ${totalPhotos}`;
                photoName.textContent = `Photo ${photoIndex + 1}`;
                
                // Update debug info
                if (debugVisible) {
                    document.getElementById('debugCurrentPhoto').textContent = photoIndex + 1;
                    document.getElementById('debugTotalPhotos').textContent = totalPhotos;
                }
                
                console.log('Photo updated to:', photoIndex + 1);
                
                // Fade in new photo
                setTimeout(() => {
                    photoImage.style.opacity = '1';
                }, 100);
            }, 200);
        }
        
        // Toggle debug panel
        function toggleDebug() {
            debugVisible = !debugVisible;
            document.getElementById('debugInfo').style.display = debugVisible ? 'block' : 'none';
        }
        
        // Reset photos
        function resetPhotos() {
            updatePhoto(0, totalPhotos);
            updateStatus('🔄 Photos reset to first image');
        }
        
        // Manual blink test
        async function manualBlink() {
            try {
                const response = await fetch('/manual_blink', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    updatePhoto(result.currentPhotoIndex, result.totalPhotos);
                    updateStatus('👁️ Manual blink triggered!', true);
                } else {
                    updateStatus(result.message);
                }
            } catch (error) {
                console.error('Manual blink error:', error);
                updateStatus('Error: ' + error.message);
            }
        }
        
        // Poll for status updates
        async function pollStatus() {
            try {
                const response = await fetch('/get_status');
                const data = await response.json();
                
                // Check if photo changed
                if (data.currentPhotoIndex !== currentPhotoIndex || data.totalPhotos !== totalPhotos) {
                    updatePhoto(data.currentPhotoIndex, data.totalPhotos);
                    
                    if (data.blinkDetected) {
                        updateStatus('🎯 Blink detected!', true);
                    }
                }
                
                // Update debug info if visible
                if (debugVisible) {
                    document.getElementById('debugLastBlink').textContent = new Date().toLocaleTimeString();
                }
                
            } catch (error) {
                console.error('Status poll error:', error);
            }
            
            // Continue polling
            setTimeout(pollStatus, 100);
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            updateStatus('📸 Loading photos...', false);
            
            // Start polling for status updates
            pollStatus();
            
            // Handle video load
            const video = document.getElementById('videoFeed');
            video.onload = function() {
                updateStatus('🎯 Camera connected! Blink to cycle through photos.');
            };
            
            video.onerror = function() {
                updateStatus('❌ Camera connection failed. Please check camera permissions.');
            };
        });
    </script>
</body>
</html>
