<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love in Every Blink 💕</title>
    
    <!-- MediaPipe FaceMesh CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    
    <!-- React and ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root {
            --rose-pink: #F8BBD0;
            --blush-pink: #F48FB1;
            --lavender: #E1BEE7;
            --peach: #FFCCBC;
            --gold: #FFD54F;
            --soft-red: #E57373;
            --off-white: #FFF7F9;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--off-white) 0%, var(--rose-pink) 50%, var(--lavender) 100%);
            color: #333;
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        #root {
            width: 100vw;
            min-height: 100vh;
        }
        
        /* Floating hearts animation */
        @keyframes floatHeart {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
        
        .floating-heart {
            position: fixed;
            color: var(--soft-red);
            animation: floatHeart 6s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }
        
        /* Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        
        /* Loading state */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, var(--rose-pink) 0%, var(--lavender) 100%);
        }
        
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Heart pulse animation */
        @keyframes heartPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .heart-pulse {
            animation: heartPulse 0.8s ease-in-out;
        }
        
        /* Glow effect */
        .glow {
            box-shadow: 0 0 20px rgba(244, 143, 177, 0.5);
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--off-white);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--blush-pink);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // Floating Hearts Component
        const FloatingHearts = () => {
            const [hearts, setHearts] = useState([]);
            
            useEffect(() => {
                const interval = setInterval(() => {
                    const newHeart = {
                        id: Date.now(),
                        left: Math.random() * 100,
                        size: Math.random() * 20 + 15,
                        duration: Math.random() * 3 + 4
                    };
                    setHearts(prev => [...prev.slice(-10), newHeart]);
                }, 2000);
                
                return () => clearInterval(interval);
            }, []);
            
            return (
                <>
                    {hearts.map(heart => (
                        <div
                            key={heart.id}
                            className="floating-heart"
                            style={{
                                left: `${heart.left}%`,
                                fontSize: `${heart.size}px`,
                                animationDuration: `${heart.duration}s`
                            }}
                        >
                            💕
                        </div>
                    ))}
                </>
            );
        };
        
        // Navigation Component
        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);
            
            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);
            
            return (
                <nav className={`fixed top-0 w-full z-50 transition-all duration-300 ${scrolled ? 'glass shadow-lg' : 'bg-transparent'}`}>
                    <div className="container mx-auto px-6 py-4">
                        <div className="flex justify-between items-center">
                            <div className="flex items-center space-x-2">
                                <span className="text-2xl">💕</span>
                                <span className="font-bold text-xl" style={{fontFamily: 'Dancing Script, cursive'}}>
                                    LoveBlink
                                </span>
                            </div>
                            
                            <div className="hidden md:flex space-x-8">
                                <a href="#home" className="hover:text-pink-600 transition-colors">Home</a>
                                <a href="#about" className="hover:text-pink-600 transition-colors">About</a>
                                <a href="#experience" className="hover:text-pink-600 transition-colors">Experience</a>
                                <a href="#contact" className="hover:text-pink-600 transition-colors">Contact</a>
                            </div>
                            
                            <button className="md:hidden text-2xl">☰</button>
                        </div>
                    </div>
                </nav>
            );
        };
        
        // Hero Section
        const Hero = () => {
            const [currentText, setCurrentText] = useState(0);
            const texts = [
                "Every blink tells a story ❤️",
                "Love is in the details",
                "Your expressions matter",
                "Feel the connection"
            ];
            
            useEffect(() => {
                const interval = setInterval(() => {
                    setCurrentText((prev) => (prev + 1) % texts.length);
                }, 3000);
                return () => clearInterval(interval);
            }, []);
            
            return (
                <section id="home" className="min-h-screen flex items-center justify-center relative">
                    <div className="text-center z-10 px-6">
                        <h1 className="text-5xl md:text-7xl font-bold mb-6" style={{fontFamily: 'Playfair Display, serif'}}>
                            {texts[currentText]}
                        </h1>
                        <p className="text-xl md:text-2xl mb-8 text-gray-700">
                            Discover the magic in every moment
                        </p>
                        <div className="flex flex-col sm:flex-row gap-4 justify-center">
                            <button 
                                onClick={() => document.getElementById('experience').scrollIntoView({behavior: 'smooth'})}
                                className="px-8 py-4 bg-gradient-to-r from-pink-400 to-purple-400 text-white rounded-full hover:scale-105 transition-transform shadow-lg"
                            >
                                Begin the Journey
                            </button>
                            <button 
                                onClick={() => document.getElementById('about').scrollIntoView({behavior: 'smooth'})}
                                className="px-8 py-4 glass rounded-full hover:scale-105 transition-transform"
                            >
                                Learn More
                            </button>
                        </div>
                    </div>
                    
                    <div className="absolute bottom-10 left-1/2 transform -translate-x-1/2 animate-bounce">
                        <span className="text-3xl">⬇️</span>
                    </div>
                </section>
            );
        };
        
        // About Section
        const About = () => {
            return (
                <section id="about" className="py-20 px-6 bg-white bg-opacity-50">
                    <div className="container mx-auto">
                        <h2 className="text-4xl font-bold text-center mb-12" style={{fontFamily: 'Playfair Display, serif'}}>
                            Our Love Story
                        </h2>
                        
                        <div className="grid md:grid-cols-3 gap-8">
                            <div className="glass p-6 rounded-2xl hover:scale-105 transition-transform">
                                <div className="text-4xl mb-4 text-center">💝</div>
                                <h3 className="text-xl font-semibold mb-3 text-center">Emotional Connection</h3>
                                <p className="text-gray-700 text-center">
                                    Every blink carries emotion, every expression tells a story of love and connection.
                                </p>
                            </div>
                            
                            <div className="glass p-6 rounded-2xl hover:scale-105 transition-transform">
                                <div className="text-4xl mb-4 text-center">✨</div>
                                <h3 className="text-xl font-semibold mb-3 text-center">Magical Moments</h3>
                                <p className="text-gray-700 text-center">
                                    Transform simple interactions into beautiful memories that last forever.
                                </p>
                            </div>
                            
                            <div className="glass p-6 rounded-2xl hover:scale-105 transition-transform">
                                <div className="text-4xl mb-4 text-center">🌸</div>
                                <h3 className="text-xl font-semibold mb-3 text-center">Gentle Experience</h3>
                                <p className="text-gray-700 text-center">
                                    Designed with love, care, and attention to every detail of your emotional journey.
                                </p>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };
        
        // Experience Section (Blink Detection)
        const Experience = () => {
            const [isDetecting, setIsDetecting] = useState(false);
            const [blinkCount, setBlinkCount] = useState(0);
            const [heartAnimation, setHeartAnimation] = useState(false);
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            
            const handleBlinkDetected = () => {
                setBlinkCount(prev => prev + 1);
                setHeartAnimation(true);
                setTimeout(() => setHeartAnimation(false), 800);
            };
            
            const startDetection = async () => {
                setIsDetecting(true);
                // MediaPipe initialization would go here
                // For now, we'll simulate blink detection
                const simulateBlinks = setInterval(() => {
                    if (Math.random() > 0.7) {
                        handleBlinkDetected();
                    }
                }, 2000);
                
                // Clean up after 30 seconds
                setTimeout(() => {
                    clearInterval(simulateBlinks);
                    setIsDetecting(false);
                }, 30000);
            };
            
            return (
                <section id="experience" className="py-20 px-6">
                    <div className="container mx-auto">
                        <h2 className="text-4xl font-bold text-center mb-12" style={{fontFamily: 'Playfair Display, serif'}}>
                            Your Expressions Matter
                        </h2>
                        
                        <div className="max-w-4xl mx-auto">
                            <div className="glass p-8 rounded-3xl">
                                <div className="grid md:grid-cols-2 gap-8">
                                    <div className="flex flex-col items-center justify-center">
                                        <div className={`text-6xl mb-4 ${heartAnimation ? 'heart-pulse' : ''}`}>
                                            💕
                                        </div>
                                        <h3 className="text-2xl font-semibold mb-4">
                                            Love Connections
                                        </h3>
                                        <div className="text-center">
                                            <div className="text-4xl font-bold text-pink-600 mb-2">
                                                {blinkCount}
                                            </div>
                                            <div className="text-gray-600">
                                                Magical Moments
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div className="flex flex-col items-center justify-center">
                                        <div className="relative">
                                            <div className="w-64 h-48 bg-gradient-to-br from-pink-200 to-purple-200 rounded-2xl flex items-center justify-center">
                                                <span className="text-6xl">👁️</span>
                                            </div>
                                            {isDetecting && (
                                                <div className="absolute inset-0 flex items-center justify-center">
                                                    <div className="w-full h-full border-4 border-pink-400 rounded-2xl animate-pulse"></div>
                                                </div>
                                            )}
                                        </div>
                                        
                                        <button
                                            onClick={startDetection}
                                            disabled={isDetecting}
                                            className={`mt-6 px-8 py-3 rounded-full font-semibold transition-all ${
                                                isDetecting 
                                                    ? 'bg-gray-300 cursor-not-allowed' 
                                                    : 'bg-gradient-to-r from-pink-400 to-purple-400 text-white hover:scale-105 shadow-lg'
                                            }`}
                                        >
                                            {isDetecting ? 'Feeling the Love...' : 'Start Experience'}
                                        </button>
                                    </div>
                                </div>
                                
                                {isDetecting && (
                                    <div className="mt-8 text-center">
                                        <div className="inline-flex items-center space-x-2 glass px-4 py-2 rounded-full">
                                            <span className="w-3 h-3 bg-pink-400 rounded-full animate-pulse"></span>
                                            <span className="text-sm">Detecting beautiful moments...</span>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </section>
            );
        };
        
        // Footer
        const Footer = () => {
            return (
                <footer className="bg-gradient-to-r from-pink-100 to-purple-100 py-12 px-6">
                    <div className="container mx-auto text-center">
                        <div className="mb-6">
                            <span className="text-3xl">💕</span>
                            <h3 className="text-2xl font-bold mt-2" style={{fontFamily: 'Dancing Script, cursive'}}>
                                Made with love for human connections
                            </h3>
                        </div>
                        
                        <div className="flex justify-center space-x-6 mb-6">
                            <button className="text-2xl hover:scale-110 transition-transform">📧</button>
                            <button className="text-2xl hover:scale-110 transition-transform">💬</button>
                            <button className="text-2xl hover:scale-110 transition-transform">🌐</button>
                        </div>
                        
                        <p className="text-gray-600">
                            © 2024 LoveBlink. Spreading love, one blink at a time.
                        </p>
                    </div>
                </footer>
            );
        };
        
        // Main App Component
        const App = () => {
            const [loading, setLoading] = useState(true);
            
            useEffect(() => {
                setTimeout(() => setLoading(false), 2000);
            }, []);
            
            if (loading) {
                return (
                    <div className="loading">
                        <div className="text-center">
                            <div className="loading-spinner mx-auto mb-4"></div>
                            <p className="text-xl">Preparing your love experience...</p>
                        </div>
                    </div>
                );
            }
            
            return (
                <div className="relative">
                    <FloatingHearts />
                    <Navbar />
                    <Hero />
                    <About />
                    <Experience />
                    <Footer />
                </div>
            );
        };
        
        // Render the app
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
